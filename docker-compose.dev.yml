# Development stack with hot reload for frontend & backend.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build   # first time only
#   docker compose -f docker-compose.dev.yml up         # daily dev (no --build)
#
# Code edits under frontend/ or backend/app reload automatically.
# Rebuild ONLY when package.json or requirements.txt change.
#
# Do NOT use docker-compose.yml (production) at the same time — it bakes static
# assets and needs rebuild for every UI change.

name: number-theory-dev

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-number_theory}
      POSTGRES_USER: ${POSTGRES_USER:-number_theory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-number_theory_dev}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-number_theory} -d ${POSTGRES_DB:-number_theory}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://number_theory:number_theory_dev@db:5432/number_theory}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,https://proof-lab.deepbrainacademy.org}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      SAGE_URL: http://sage:8011
      LEAN_URL: http://lean:8012
      VERIFIER_TIMEOUT: ${VERIFIER_TIMEOUT:-310}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SESSION_SECRET: ${SESSION_SECRET:-dev-insecure-session-secret-change-me}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      AUTO_PROVE_RUNS_DIR: ${AUTO_PROVE_RUNS_DIR:-/data/auto_prove_runs}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./data/auto_prove_runs:/data/auto_prove_runs
    depends_on:
      db:
        condition: service_healthy
      sage:
        condition: service_healthy
      lean:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  sage:
    build:
      context: ./services/sage
    ports:
      - "8011:8011"
    environment:
      DOT_SAGE: /tmp/.sage
    volumes:
      - ./services/sage/server.py:/app/server.py:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "sage", "-python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  lean:
    build:
      context: ./services/lean
    ports:
      - "8012:8012"
    environment:
      LEAN_TIMEOUT: ${LEAN_TIMEOUT:-300}
    volumes:
      - ./services/lean/server.py:/app/server.py:ro
      - ./services/lean/smoke.lean:/app/smoke.lean:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8012/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "1000"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next_cache:
